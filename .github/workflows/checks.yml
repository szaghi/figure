# FIGURE's own checks, beside the FoBiS scaffold's ci.yml (kept verbatim, so that `fobis scaffold sync` updates it):
#   - docs: the documentation's checks (#6 §4.10): the feature map, the doc comments, an example in every section,
#     the docs' version strings, the name map, the media sizes; the oracle's coverage (#15 P1: every public name and
#     interaction class checked by a picture and a behaviour, or exempt); every example compiled, the headless ones
#     run; every picture of the site rendered headless by FIGURE's CPU renderer and compared with the committed one
#     (#7 §4.6);
#   - tsan: ThreadSanitizer on the calls a task may make (quit, request_frames, wake, ...): scripts/tsan_check.sh;
#   - fortran-path: the tests and the examples of the Fortran path (#15 §2, the -fortran modes of fobos), beside ci.yml's
#     current path (the Platforms workflow builds nvfortran's and ifx's), and the symbols their programs define: none of
#     the C++ libraries above Dear ImGui (#15 G2, scripts/check_fortran_path_symbols.py).
# All run in the toolchain image of ci.yml (fobos [scaffold] toolchain_image: gfortran 16.2, the compiler the pictures
# are rendered with), with the packages it lacks (fobos [scaffold] toolchain_packages, plus ImageMagick).
name: Checks

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # a release tag points at a commit already checked on its branch push
  pull_request:

# a newer push to the same ref supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # the forms nvfortran 26.9 compiles wrong (docs/adr/0001-fortran-stack.md), kept out of the Fortran sources
    - name: nvfortran patterns
      run: |
        python3 scripts/check_nvf_patterns.py --self-test
        python3 scripts/check_nvf_patterns.py

    # the benchmark's statistics and speed gates (szaghi/figure#16), on fixed numbers
    - name: Benchmark tools
      run: |
        python3 scripts/bench_scenes.py --self-test
        python3 scripts/profile_scene.py --self-test

    - name: Packages the toolchain image lacks
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ninja-build libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl-dev libdbus-1-dev libdecor-0-dev \
          imagemagick

    # the examples link against lib/libfigure_native.a and lib/libSDL3.a (docs/examples/build.sh)
    - name: Native layer
      run: scripts/build_native.sh

    # FUNDAL, which FIGURE's library uses (#15 P6), for docs/examples/build.sh
    - name: Fortran libraries (fobis fetch)
      run: fobis fetch

    - name: Docs checks
      run: |
        python3 scripts/check_docs.py --names --media
        python3 scripts/oracle_coverage.py --check
        bash docs/examples/build.sh

    # each recording's poster, rendered headless (no display, no GPU) and compared with the committed one: per channel
    # |d| <= 2, no pixel more (docs/media/*.rec state their masks and any per-platform tolerance); the programs are
    # build.sh's and the examples mode's (figure_hello, figure_mandelbrot)
    - name: Pictures checked
      run: |
        fobis build --mode examples-gnu
        python3 scripts/docs_media.py --check

    - name: Pictures that differ
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pictures-that-differ
        path: |
          docs/public/media/*.new.png
          docs/public/media/*.diff.png
        if-no-files-found: ignore

  tsan:
    runs-on: ubuntu-latest
    # privileged: the address space randomization below is the kernel's, read-only to an unprivileged container
    container:
      image: ghcr.io/szaghi/fortran-toolchains:gnu-16.2
      options: --privileged

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Packages the toolchain image lacks
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ninja-build libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl-dev libdbus-1-dev libdecor-0-dev

    # ThreadSanitizer's shadow memory does not fit the randomized layout of the runners' kernels (32 bits)
    - name: Narrow address space randomization
      run: echo 28 > /proc/sys/vm/mmap_rnd_bits

    - name: ThreadSanitizer check
      run: CC=gcc CXX=g++ scripts/tsan_check.sh

  fortran-path:
    runs-on: ubuntu-latest
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Packages the toolchain image lacks
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ninja-build libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl-dev libdbus-1-dev libdecor-0-dev

    - name: Native layer
      run: scripts/build_native.sh

    - name: Fortran libraries (fobis fetch)
      run: fobis fetch

    - name: Tests, the Fortran path (FoBiS)
      run: |
        fobis build --mode tests-gnu-fortran
        bash scripts/run_tests.sh

    - name: Examples, the Fortran path (FoBiS)
      run: fobis build --mode examples-gnu-fortran

    # #15 G2: the Fortran path's programs (the tests and examples just built) link none of ImPlot, ImPlot3D, ImGuizmo,
    # ImGradient, TextEditor; the side-by-side tests only what their reference modules need
    - name: Fortran-path symbols
      run: |
        python3 scripts/check_fortran_path_symbols.py --self-test
        python3 scripts/check_fortran_path_symbols.py exe exe/examples
