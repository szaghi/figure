name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # a release tag points at a commit already tested on its branch push
  pull_request:

# a newer push to the same ref supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: FoBiS.py fetch

    - name: Run tests with coverage
      id: cov
      uses: ./.github/actions/run-coverage-analysis

    # docs.yml (workflow_run) publishes these outputs instead of running the
    # coverage a second time: every file the coverage step wrote or changed
    # under docs/ (badge JSON, coverage-analysis page, per-file gcov pages),
    # git-ignored ones included, so docs.yml sees what a local run would
    - name: Pack the coverage outputs for the docs
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        git ls-files --others --modified -- docs | while IFS= read -r f; do
          if [ -f "$f" ]; then printf '%s\n' "$f"; fi
        done > coverage-docs.list
        cat coverage-docs.list
        tar -czf coverage-docs.tgz -T coverage-docs.list

    - name: Upload the coverage outputs for the docs
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-docs
        path: coverage-docs.tgz
        if-no-files-found: error
        retention-days: 1

    # the documentation's checks (#6 §4.10), on the native layer the coverage step built: the feature map, the doc
    # comments, an example in every section, the name map, the media sizes; every example compiled, the headless run
    - name: Docs checks
      run: |
        python3 scripts/check_docs.py --names --media
        bash docs/examples/build.sh

  # ThreadSanitizer on the calls a task may make (quit, request_frames, wake, ...): scripts/tsan_check.sh
  tsan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    # ThreadSanitizer's shadow memory does not fit the randomized layout of the runners' kernels (32 bits)
    - name: Narrow address space randomization
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: ThreadSanitizer check
      run: CC=gcc CXX=g++-14 scripts/tsan_check.sh
