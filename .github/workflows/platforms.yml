# Platforms beyond ci.yml (Linux, gfortran, coverage; managed by `fobis scaffold`): macOS and Windows with gfortran,
# Linux with nvfortran and with Intel ifx. Each job builds the native layer, checks the platform's fobos varset against
# the static link line SDL reports for it (scripts/check_sync.py), builds and runs the headless tests with FoBiS and
# with fpm, builds the examples, and builds FIGURE as a plain fpm dependency of another project
# (scripts/fpm_consumer.sh). Headless tests need no display and no GPU. The macOS, Windows and nvfortran jobs also run
# an example in a real window (scripts/window_check.py: frames captured and checked, kept as the window-frames-*
# artifacts), Linux under Xvfb, Windows on Mesa's software OpenGL (the runner's own is OpenGL 1.1).
name: Platforms

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS (gfortran, Apple clang)
    runs-on: macos-15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Python (scripts need 3.11+, tomllib)
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Fortran compiler
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: gcc
        version: 14

    - name: Build tools
      run: |
        brew install ninja pkg-config
        python -m pip install FoBiS.py

    # v0.12.0 here: v0.13.0's macOS binary is linked against Homebrew's gcc@12 runtime
    # (/opt/homebrew/opt/gcc@12/lib/gcc/12/libgfortran.5.dylib), which the runner does not have
    - name: fpm
      uses: fortran-lang/setup-fpm@v9
      with:
        fpm-version: v0.12.0
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # setup-fortran exports CC=gcc/CXX=g++ (Homebrew GCC): SDL needs clang on Apple (-fobjc-arc), and the link line
    # uses libc++, so the native layer is built with Apple clang (CMake caches the choice for later pre_build runs)
    - name: Native layer
      env:
        CC: clang
        CXX: clang++
      run: |
        ${FC} --version && clang++ --version && cmake --version
        scripts/build_native.sh
        cat lib/pkgconfig/sdl3.pc

    - name: Link line of this platform (fobos varset vs SDL)
      run: python3 scripts/check_sync.py

    - name: Tests (FoBiS)
      run: |
        fobis build --mode tests-gnu --varset macos
        bash scripts/run_tests.sh

    - name: Examples (FoBiS)
      run: |
        rm -rf mod obj exe
        fobis build --mode examples-gnu --varset macos

    - name: Windowed run (figure_hello, frames checked)
      run: python3 scripts/window_check.py --out window-frames

    # no windowed run with floating-point traps here: on Apple silicon gfortran's -ffpe-trap makes any FP exception a
    # SIGILL, and AppKit's own event handling raises them (outside FIGURE's GL calls); the Windows job runs it (Mesa)

    - name: Upload the frames of the windowed run
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: window-frames-macos
        path: window-frames
        if-no-files-found: warn

    - name: Tests (fpm)
      run: scripts/fpm.sh test --compiler "${FC}"

    # FIGURE as a plain fpm dependency of another project: fpm compiles the native layer itself, SDL3 from Homebrew.
    # The C/C++ compiler is Apple clang: on macOS fpm links the C++ runtime as libc++ (g++ objects need libstdc++).
    # Apple clang defaults to C++98, and fpm takes no C++ flags from a manifest (0.12): FPM_CXXFLAGS gives C++17.
    - name: fpm dependency (system SDL3)
      run: |
        brew install sdl3
        export CPATH="$(brew --prefix)/include" LIBRARY_PATH="$(brew --prefix)/lib" FPM_CXXFLAGS="-std=c++17"
        scripts/fpm_consumer.sh -- --compiler "${FC}" --c-compiler clang --cxx-compiler clang++

  windows:
    name: Windows (MSYS2 UCRT64 gfortran)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: MSYS2 toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: git
        # python-pydantic: FoBiS's typer needs pydantic, whose pydantic-core has no wheel for MSYS2's Python (pip
        # would build it from source, with Rust); MSYS2's package is prebuilt
        pacboy: >-
          gcc-fortran:p cmake:p ninja:p pkgconf:p python:p python-pip:p python-pydantic:p fpm:p sdl3:p mesa:p

    # the runner's display is 1024 x 768, narrower than figure_hello's window (1100 x 700)
    - name: Display resolution
      shell: pwsh
      run: |
        try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Warning "$_" }
        Get-CimInstance Win32_VideoController | Format-List Name, CurrentHorizontalResolution, CurrentVerticalResolution

    - name: FoBiS
      run: python -m pip install --break-system-packages FoBiS.py

    - name: Native layer
      run: |
        gfortran --version && g++ --version && cmake --version
        CC=gcc CXX=g++ scripts/build_native.sh
        cat lib/pkgconfig/sdl3.pc

    - name: Link line of this platform (fobos varset vs SDL)
      run: python scripts/check_sync.py

    - name: Tests (FoBiS)
      run: |
        fobis build --mode tests-gnu --varset windows
        bash scripts/run_tests.sh

    - name: Examples (FoBiS)
      run: |
        rm -rf mod obj exe
        fobis build --mode examples-gnu --varset windows

    # the runner has no GPU and Windows' own OpenGL is 1.1: Mesa's opengl32.dll (llvmpipe), placed beside the program,
    # is loaded before the system's
    - name: Windowed run (figure_hello, frames checked)
      env:
        GALLIUM_DRIVER: llvmpipe
      run: |
        cp /ucrt64/bin/opengl32.dll exe/examples/
        python scripts/window_check.py --out window-frames

    # the same, built with floating-point traps: Mesa's own arithmetic raises IEEE flags, which the native layer masks
    # around its GL calls (a program built with -ffpe-trap stopped at its window's creation before)
    - name: Windowed run with floating-point traps (figure_hello built with -ffpe-trap)
      env:
        GALLIUM_DRIVER: llvmpipe
      run: |
        fobis build --mode examples-gnu-traps --varset windows
        cp /ucrt64/bin/opengl32.dll exe/examples-traps/
        python scripts/window_check.py --program exe/examples-traps/figure_hello --out window-frames-traps

    - name: Upload the frames of the windowed run
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: window-frames-windows
        path: window-frames
        if-no-files-found: warn

    - name: Tests (fpm)
      run: scripts/fpm.sh test

    # FIGURE as a plain fpm dependency of another project: fpm compiles the native layer itself, SDL3 from MSYS2
    - name: fpm dependency (system SDL3)
      run: scripts/fpm_consumer.sh

  linux-nvfortran:
    name: Linux (nvfortran)
    runs-on: ubuntu-latest
    env:
      NVHPC: "26.9"            # the version of the development machines; NVIDIA's apt repository names it nvhpc-26-9
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Python (scripts need 3.11+, tomllib)
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # the full SDK (CUDA math libraries included) does not fit beside the runner's preinstalled toolchains
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    - name: NVIDIA HPC SDK
      run: |
        curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
          | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
        echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' \
          | sudo tee /etc/apt/sources.list.d/nvhpc.list
        sudo apt-get update -y
        sudo apt-get install -y "nvhpc-${NVHPC//./-}" cmake ninja-build libxext-dev libxrandr-dev libxcursor-dev \
          libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl-dev libdbus-1-dev \
          xvfb libgl1-mesa-dri libglx-mesa0
        echo "/opt/nvidia/hpc_sdk/Linux_x86_64/${NVHPC}/compilers/bin" >> "$GITHUB_PATH"
        pip install FoBiS.py

    - name: Native layer
      run: |
        nvfortran --version && g++ --version
        CC=gcc CXX=g++ scripts/build_native.sh

    - name: Link line of this platform (fobos varset vs SDL)
      run: python3 scripts/check_sync.py

    - name: Tests (FoBiS)
      run: |
        fobis build --mode tests-nvf
        bash scripts/run_tests.sh

    - name: Examples (FoBiS)
      run: |
        rm -rf mod obj exe
        fobis build --mode examples-nvf

    # no display on the runner: Xvfb, 24-bit (xvfb-run's default screen is 640 x 480, 8-bit), OpenGL by Mesa (llvmpipe)
    - name: Windowed run under Xvfb (figure_hello, frames checked)
      run: xvfb-run -a -s "-screen 0 1280x1024x24" python3 scripts/window_check.py --out window-frames

    - name: Upload the frames of the windowed run
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: window-frames-linux
        path: window-frames
        if-no-files-found: warn

    - name: fpm
      uses: fortran-lang/setup-fpm@v9
      with:
        fpm-version: v0.13.0
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # with --flag fpm drops its own nvfortran flags, -Mbackslash among them: given back, with fobos' -Munixlogical
    # (.true. is 1, the value of a C bool; also passed to the link by fpm) and -mp (thread-safe I/O, for the tasks)
    - name: Tests (fpm)
      run: scripts/fpm.sh test --compiler nvfortran --flag "-Mbackslash -Munixlogical -mp"

    # FIGURE as a plain fpm dependency of another project, with gfortran: Ubuntu 24.04 has no SDL3 package, so the
    # static SDL3 the native build installed (lib/, include/) stands in for it
    - name: fpm dependency (SDL3 from the native build)
      run: scripts/fpm_consumer.sh --sdl-prefix . -- --compiler gfortran

  linux-ifx:
    name: Linux (Intel ifx)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # oneAPI from Intel's apt repository (setup-fortran sources setvars.sh and exports FC=ifx, CC=icx, CXX=icpx); the
    # newest ifx it knows, while the development machines have 2026.2
    - name: Fortran compiler
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: intel
        version: "2026.1"

    # after setup-fortran, which writes the whole PATH of setvars.sh to GITHUB_PATH: this Python comes first
    - name: Python (scripts need 3.11+, tomllib)
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake ninja-build libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
          libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl-dev libdbus-1-dev
        python -m pip install FoBiS.py

    # the native layer with gcc/g++, as for nvfortran: ifx links libstdc++
    - name: Native layer
      run: |
        ifx --version && g++ --version
        CC=gcc CXX=g++ scripts/build_native.sh

    - name: Link line of this platform (fobos varset vs SDL)
      run: python3 scripts/check_sync.py

    - name: Tests (FoBiS)
      run: |
        fobis build --mode tests-ifx
        bash scripts/run_tests.sh

    - name: Static library (FoBiS)
      run: fobis build --mode figure-static-ifx

    - name: Examples (FoBiS)
      run: |
        rm -rf mod obj exe
        fobis build --mode examples-ifx

    - name: fpm
      uses: fortran-lang/setup-fpm@v9
      with:
        fpm-version: v0.13.0
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # -fpscomp logicals, as fobos' $CIFX: .true. is 1, the value of a C bool (fpm's ifx flags leave it -1)
    - name: Tests (fpm)
      run: scripts/fpm.sh test --compiler ifx --flag "-fpscomp logicals"

    # FIGURE as a plain fpm dependency of another project, compiled by ifx (the C/C++ by gcc/g++); SDL3 from the
    # native build (Ubuntu 24.04 has no SDL3 package)
    - name: fpm dependency (SDL3 from the native build)
      run: |
        scripts/fpm_consumer.sh --sdl-prefix . -- --compiler ifx --c-compiler gcc --cxx-compiler g++ \
          --flag "-fpscomp logicals"
