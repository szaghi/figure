# fpm manifest, kept in sync with fobos (the primary build): scripts/check_sync.py verifies the link libraries and that
# every program under src/examples/ and src/tests/ is declared here.
# Build the native layer first (scripts/build_native.sh), then use scripts/fpm.sh, which adds -L lib/ to fpm.
name = "figure"
version = "0.1.0"
license = "MIT"
author = "Stefano Zaghi"
maintainer = "stefano.zaghi@cnr.it"
description = "FIGURE, Fortran Immediate-mode GUI for User interfaces, Rendering and Exploration"

[build]
auto-executables = false
auto-examples = false
auto-tests = false
link = ["figure_native", "SDL3", "figure_platform"]  # figure_platform: written by scripts/fpm.sh (see check_sync.py)

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src/lib"

[[example]]
name = "figure_hello"
source-dir = "src/examples"
main = "figure_hello.F90"

[[example]]
name = "figure_mandelbrot"
source-dir = "src/examples"
main = "figure_mandelbrot.F90"

[[example]]
name = "figure_bench_texture"
source-dir = "src/examples"
main = "figure_bench_texture.F90"

[[example]]
name = "figure_bench_redraw"
source-dir = "src/examples"
main = "figure_bench_redraw.F90"

[[test]]
name = "figure_test_headless"
source-dir = "src/tests"
main = "figure_test_headless.F90"

[[test]]
name = "figure_test_remote"
source-dir = "src/tests"
main = "figure_test_remote.F90"

[[test]]
name = "figure_test_themes"
source-dir = "src/tests"
main = "figure_test_themes.F90"

[[test]]
name = "figure_test_forms"
source-dir = "src/tests"
main = "figure_test_forms.F90"

[[test]]
name = "figure_test_text"
source-dir = "src/tests"
main = "figure_test_text.F90"

[[test]]
name = "figure_test_menus"
source-dir = "src/tests"
main = "figure_test_menus.F90"

[[test]]
name = "figure_test_popups"
source-dir = "src/tests"
main = "figure_test_popups.F90"

[[test]]
name = "figure_test_plots"
source-dir = "src/tests"
main = "figure_test_plots.F90"

[[test]]
name = "figure_test_layout"
source-dir = "src/tests"
main = "figure_test_layout.F90"
