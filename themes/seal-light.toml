# FIGURE theme "seal-light": the seal on paper.
# Paper windows, ink text, the same vermilion accents.
# Format: docs/guide/styles.md#theme-files. Entries not given come from `base`.

base = "light"
background = "#e6e0d4"
lines = ["#b42d1a", "#16130f", "#a57a2a", "#4a6a80", "#5f7a3a", "#7d4a6a", "#c0603a", "#6b645a"]

[imgui.vars]
# the seal's edges are cut straight: no rounding anywhere
WindowRounding = 0
ChildRounding = 0
FrameRounding = 0
PopupRounding = 0
ScrollbarRounding = 0
GrabRounding = 0
TabRounding = 0

[imgui.colors]
Text = "#16130f"
TextDisabled = "#8a8278"
WindowBg = "#fbf9f4"
ChildBg = ["#fbf9f4", 0.0]
PopupBg = ["#ffffff", 0.97]
Border = "#d8d0c2"
BorderShadow = ["#000000", 0.0]
FrameBg = "#ece6da"
FrameBgHovered = "#e2dacb"
FrameBgActive = "#d8cfbf"
TitleBg = "#ece6da"
